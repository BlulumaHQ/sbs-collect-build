name: Sync Shopify catalogue

on:
  schedule:
    - cron: "17 * * * *" # every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-shopify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Snapshot Shopify products
        env:
          SHOPIFY_STORE_DOMAIN: ${{ vars.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
        run: node scripts/sync-shopify-catalog.mjs
      - name: Commit if products changed
        run: |
          # generatedAt changes every run; only commit when the products themselves changed
          if git diff --quiet -- src/data/shopify-products.json; then echo "No changes"; exit 0; fi
          if git diff -U0 -- src/data/shopify-products.json | grep '^[+-] ' | grep -qv '"generatedAt"'; then
            git config user.name "SBS Catalogue Sync"
            git config user.email "sony@bluluma.com"
            git add src/data/shopify-products.json
            git commit -m "Sync Shopify catalogue"
            git push
          else
            echo "Only timestamp changed"
          fi
