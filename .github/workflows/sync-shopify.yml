name: Sync Shopify catalogue

on:
  schedule:
    - cron: "17 * * * *" # every hour
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/sync-shopify.yml"

permissions:
  contents: write

concurrency:
  group: sync-shopify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install image tools
        run: npm install --prefix "$RUNNER_TEMP/imgtools" --no-audit --no-fund sharp@0.33
      - name: Snapshot Shopify products
        env:
          IMG_TOOLS_DIR: ${{ runner.temp }}/imgtools
          SHOPIFY_STORE_DOMAIN: 2zzz0q-zy.myshopify.com
          # Public Storefront API token (Headless channel). Shopify designs this token
          # to be shipped in browser code; it can only read published product data.
          SHOPIFY_STOREFRONT_TOKEN: 24f20e0c826c4efae07275781120b196
        run: node scripts/sync-shopify-catalog.mjs
      - name: Commit if products changed
        run: |
          # generatedAt changes every run; only commit when the products themselves changed
          if git diff --quiet -- src/data/shopify-products.json; then echo "No changes"; exit 0; fi
          if git diff -U0 -- src/data/shopify-products.json | grep '^[+-] ' | grep -qv '"generatedAt"'; then
            git config user.name "SBS Catalogue Sync"
            git config user.email "sony@bluluma.com"
            git add src/data/shopify-products.json src/data/image-framing.json
            git commit -m "Sync Shopify catalogue"
            git push
          else
            echo "Only timestamp changed"
          fi
